<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📚 Student Study Planner</h1>
        <p>Plan your study tasks and stay productive!</p>

        <div class="task-input">

    <input type="text" id="taskInput" placeholder="Enter your study task">

    <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>

    <button onclick="addTask()">Add Task</button>

</div>

        <h2>My Tasks</h2>

        <ul id="taskList"></ul>

        <div class="task-count">
            <p>Pending: <span id="pendingCount">0</span></p>
            <p>Completed: <span id="completedCount">0</span></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
